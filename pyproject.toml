[project]
name = "homevolt-local"
version = "0.0.12"
description = "Home Assistant integration for Homevolt battery systems"
requires-python = ">=3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
# Deliberately kept at py313: the runtime floor is 3.14, but py314 makes ruff rewrite
# `except (A, B):` into the PEP 758 unparenthesized form, which we don't want.
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_ignores = true
